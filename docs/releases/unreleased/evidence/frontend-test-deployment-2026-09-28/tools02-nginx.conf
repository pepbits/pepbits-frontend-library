server {
    listen 80;
    listen [::]:80;
    server_name frontend.test.pepbits.com;
    return 301 https://frontend.test.pepbits.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontend.test.pepbits.com;
    ssl_certificate /etc/nginx/frontend-test/fullchain.pem;
    ssl_certificate_key /etc/nginx/frontend-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    access_log /var/log/nginx/frontend-test-access.log;
    error_log /var/log/nginx/frontend-test-error.log;
    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://127.0.0.1:33412/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:33410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
