map $http_upgrade $frontend_test_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name frontend.test.pepbits.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pepbits-frontend-test-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontend.test.pepbits.com;
    ssl_certificate /etc/letsencrypt/live/pepbits-frontend-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pepbits-frontend-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location / {
        proxy_pass https://148.135.138.193;
        proxy_ssl_server_name on;
        proxy_ssl_name frontend.test.pepbits.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_http_version 1.1;
        proxy_set_header Host frontend.test.pepbits.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $frontend_test_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }
}
