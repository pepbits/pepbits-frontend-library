name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_API_URL: /api
  VITE_API_URL: /api
  NEXT_PUBLIC_SETTLE_API_URL: /settle-api
  NEXT_PUBLIC_CAREGRID_API_URL: /caregrid-api
  HC_RCM_MOCK_REPO: ${{ github.workspace }}/test-dependencies/mock-services
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/checkout@v4
        with:
          repository: pepbits/pepbits-mocking-app
          ref: 5ced4f8b021aa317859e6999d7c96ef14af63ee1
          path: test-dependencies/mock-services
          token: ${{ secrets.MOCK_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install root workspace and backend
        run: npm ci --no-audit --no-fund && bash tooling/scripts/install-api.sh
      - name: Packages, demos, documentation, backend and deployment contracts
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tooling/scripts/ci-gates.sh
      - name: Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Shell browser regressions
        run: npm run test:browser -w @pepbits/shell
      - name: Sequential production demo workflows and axe
        run: |
          for demo in reports school tenant-admin healthcare erp desktop; do
            node tooling/scripts/run-demo-integration.mjs "$demo"
          done
      - name: Build and validate test-site archive locally
        run: npm run package:test-site && npm run verify:test-site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: root-check-diagnostics
          path: |
            demo-apps/*/.next/build-manifest.json
            /tmp/*-integration-identity.json
            /tmp/*-browser.json
            /tmp/*-result.json
          retention-days: 7
          if-no-files-found: ignore
  native-linux:
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
      - run: npm ci --no-audit --no-fund && bash tooling/scripts/install-api.sh && npm run build:api
      - name: Build desktop native executable
        env:
          VITE_API_URL: http://127.0.0.1:3330
        run: npm exec -w @pepbits-demo/desktop -- tauri build --debug --no-bundle
      - name: Native host lifecycle and localization
        run: bash tooling/scripts/check-native.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-diagnostics
          path: /tmp/pepbits-native-*/
          retention-days: 7
